# Read the Docs configuration for blox.
# https://docs.readthedocs.com/platform/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    # pandoc is required by nbsphinx for rendering Jupyter notebooks.
    - pandoc

sphinx:
  configuration: docs/conf.py

formats:
  - htmlzip

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
