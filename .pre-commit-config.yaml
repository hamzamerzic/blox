repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      # Run the linter
      - id: ruff
        types_or: [python, pyi, jupyter]
        args: [ --fix ]
  - repo: https://github.com/google/pyink
    rev: 24.10.1
    hooks:
      - id: pyink
        types_or: [python, pyi, jupyter]